services:
    # Form services
    drsoft_fr.module.validate_customer.form.data_provider.setting_form_data_provider:
        class: DrSoftFr\Module\ValidateCustomer\Form\DataProvider\SettingFormDataProvider
        arguments:
            - '@drsoft_fr.module.validate_customer.data.configuration.setting_configuration'

    drsoft_fr.module.validate_customer.form.handler.setting_form_handler:
        class: PrestaShop\PrestaShop\Core\Form\Handler
        arguments:
            - '@form.factory'
            - '@prestashop.core.hook.dispatcher'
            - '@drsoft_fr.module.validate_customer.form.data_provider.setting_form_data_provider'
            - DrSoftFr\Module\ValidateCustomer\Form\SettingType
            - 'DrSoftFrModuleValidateCustomerSetting'
        public: true

    # setting form
    drsoft_fr.module.validate_customer.form.setting_type:
        class: DrSoftFr\Module\ValidateCustomer\Form\SettingType
        parent: 'form.type.translatable.aware'
        arguments:
            - '@=service("prestashop.adapter.data_provider.cms").getCmsChoices()'
        tags:
            - { name: form.type }
